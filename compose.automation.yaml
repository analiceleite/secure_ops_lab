# Incremento inicial 04: infraestrutura; sem actions/workflows/alteracao do server Zabbix.
x-automation-runtime: &automation-runtime
  profiles: [automation]
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  restart: "no"
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

services:
  automation-db:
    <<: *automation-runtime
    image: postgres:17.11-bookworm@sha256:858bb5e98eed02eb8cafbcdc007f9a65d1b613972028944a8ec2133ccaf80d27
    user: "999:999"
    mem_limit: 256m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/automation-postgres-bootstrap
      POSTGRES_INITDB_ARGS: --auth-local=peer --auth-host=scram-sha-256
    secrets: [automation-postgres-bootstrap, automation-n8n-db, automation-incident-ingest, automation-incident-report, automation-incident-reader]
    networks: [automation]
    volumes:
      - automation-db-data:/var/lib/postgresql/data
      - type: bind
        source: ./infra/automation/10-create-databases.sh
        target: /docker-entrypoint-initdb.d/10-create-databases.sh
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test: [CMD, pg_isready, -U, postgres, -d, postgres]
      interval: 5s
      timeout: 3s
      retries: 24
      start_period: 10s

  n8n:
    <<: *automation-runtime
    image: docker.n8n.io/n8nio/n8n:2.44.7@sha256:942bc274709f27f99f7c6024a785d8e8f75ac06838cabcba448abb8d9127ec7b
    user: "1000:1000"
    read_only: true
    mem_limit: 512m
    networks: [automation, events, inference, mail, operations]
    ports: ["127.0.0.1:5678:5678"]
    volumes: [n8n-data:/home/node/.n8n]
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=1770,size=64m
      - /home/node/.cache:uid=1000,gid=1000,mode=0700,size=64m
    secrets: [automation-n8n-db, automation-n8n-key]
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: automation-db
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_meta
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/automation-n8n-db
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/automation-n8n-key
      N8N_HOST: localhost
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PORT: "5678"
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_WEBHOOK_URL: http://n8n:5678/
      # Excecao local documentada na SPEC 04; nunca usar credenciais reais/TLS ficticio.
      N8N_SECURE_COOKIE: "false"
      N8N_SAMESITE_COOKIE: strict
      GENERIC_TIMEZONE: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_TEMPLATES_ENABLED: "false"
      N8N_LICENSE_AUTO_RENEW_ENABLED: "false"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      # A IA de relatorio usa HTTP Request para Ollama local, nao gateway/assistant cloud.
      N8N_AI_ENABLED: "false"
      N8N_AI_GATEWAY_ENABLED: "false"
      N8N_AI_ALLOW_SENDING_PARAMETER_VALUES: "false"
      N8N_MCP_BUILDER_ENABLED: "false"
      N8N_PYTHON_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_PREVENT_LOADING: "true"
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      N8N_VERIFIED_PACKAGES_ENABLED: "false"
      N8N_LOG_LEVEL: warn
      N8N_SENTRY_DSN: ""
      N8N_FRONTEND_SENTRY_DSN: ""
      NODES_INCLUDE: '["n8n-nodes-base.webhook","n8n-nodes-base.respondToWebhook","n8n-nodes-base.postgres","n8n-nodes-base.httpRequest","n8n-nodes-base.emailSend","n8n-nodes-base.scheduleTrigger","n8n-nodes-base.set","n8n-nodes-base.if","n8n-nodes-base.manualTrigger"]'
      EXECUTIONS_MODE: regular
      EXECUTIONS_TIMEOUT: "10"
      EXECUTIONS_TIMEOUT_MAX: "300"
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "4"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: none
      EXECUTIONS_DATA_SAVE_MANUAL_EXECUTIONS: "false"
      EXECUTIONS_DATA_SAVE_ON_PROGRESS: "false"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "1000"
      N8N_PAYLOAD_SIZE_MAX: "1"
    depends_on:
      automation-db: {condition: service_healthy}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5678/healthz/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  ollama:
    <<: *automation-runtime
    image: secureops-ollama:0.1.0
    build: {context: ./infra/automation, dockerfile: ollama.Dockerfile}
    user: "1000:1000"
    read_only: true
    mem_limit: 2g
    cpus: 4
    networks: [inference]
    volumes: [ollama-data:/home/ollama/.ollama]
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1770,size=128m"]
    environment:
      HOME: /home/ollama
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_MODELS: /home/ollama/.ollama/models
      OLLAMA_NO_CLOUD: "true"
      OLLAMA_NOHISTORY: "true"
      OLLAMA_NOPRUNE: "true"
      OLLAMA_DEBUG_LOG_REQUESTS: "false"
      OLLAMA_CONTEXT_LENGTH: "2048"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_MAX_QUEUE: "2"
      OLLAMA_KEEP_ALIVE: "0"
      OLLAMA_LOAD_TIMEOUT: 120s
      CUDA_VISIBLE_DEVICES: "-1"
      OLLAMA_VULKAN: "false"
    command: [serve]
    healthcheck:
      test: [CMD, ollama, list]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    <<: *automation-runtime
    image: secureops-mailpit:0.1.0
    build: {context: ./infra/automation, dockerfile: mailpit.Dockerfile}
    user: "1000:1000"
    read_only: true
    mem_limit: 128m
    networks: [mail, operations]
    ports: ["127.0.0.1:8025:8025"]
    volumes: [mailpit-data:/data]
    tmpfs: ["/tmp:uid=1000,gid=1000,mode=1770,size=16m"]
    secrets: [automation-mailpit-ui, automation-mailpit-smtp]
    environment:
      MP_DATABASE: /data/mailpit.db
      MP_UI_AUTH_FILE: /run/secrets/automation-mailpit-ui
      MP_SMTP_AUTH_FILE: /run/secrets/automation-mailpit-smtp
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
      MP_SMTP_ALLOWED_RECIPIENTS: '^operadora@lab\.invalid$'
      MP_SMTP_MAX_RECIPIENTS: "1"
      MP_SMTP_DISABLE_RDNS: "true"
      MP_MAX_MESSAGES: "0"
      MP_MAX_MESSAGE_SIZE: "1"
      MP_DISABLE_VERSION_CHECK: "true"
      MP_BLOCK_REMOTE_CSS_AND_FONTS: "true"
      MP_HIDE_DELETE_ALL_BUTTON: "true"
      MP_QUIET: "true"
      MP_SMTP_RELAY_ALL: "false"
      MP_ENABLE_CHAOS: "false"
      MP_ALLOWED_HOSTS: localhost,127.0.0.1,mailpit

networks:
  automation: {driver: bridge, internal: true}
  events: {driver: bridge, internal: true}
  inference: {driver: bridge, internal: true}
  mail: {driver: bridge, internal: true}
  operations: {driver: bridge, internal: false}
volumes:
  automation-db-data:
  n8n-data:
  ollama-data:
  mailpit-data:
secrets:
  automation-postgres-bootstrap: {file: ./.local/automation/postgres-bootstrap-password}
  automation-n8n-db: {file: ./.local/automation/n8n-db-password}
  automation-incident-ingest: {file: ./.local/automation/incident-ingest-password}
  automation-incident-report: {file: ./.local/automation/incident-report-password}
  automation-incident-reader: {file: ./.local/automation/incident-reader-password}
  automation-n8n-key: {file: ./.local/automation/n8n-encryption-key}
  automation-mailpit-ui: {file: ./.local/automation/mailpit-ui-auth}
  automation-mailpit-smtp: {file: ./.local/automation/mailpit-smtp-auth}
