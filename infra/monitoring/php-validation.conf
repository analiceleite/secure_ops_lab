; Somente harness efemero, rede interna exclusiva, sem publicacao/DB/segredos.
[global]
daemonize = no
error_log = /proc/self/fd/2

[validation]
listen = 0.0.0.0:9000
pm = static
pm.max_children = 1
catch_workers_output = yes
clear_env = yes
security.limit_extensions = .php
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
