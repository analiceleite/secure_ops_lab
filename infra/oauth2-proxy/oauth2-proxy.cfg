# Exceção HTTP local aprovada na SPEC 02. Não reutilizar em produção.
http_address = "0.0.0.0:4180"
provider = "keycloak-oidc"
provider_display_name = "Keycloak local — senha + TOTP"
oidc_issuer_url = "http://keycloak.localhost:8080/realms/secureops-lab"
client_id = "secureops-gateway"
client_secret_file = "/run/secrets/client-secret"
redirect_url = "http://app.localhost:4180/oauth2/callback"
scope = "openid profile email groups"
code_challenge_method = "S256"
oidc_groups_claim = "groups"
oidc_audience_claims = ["aud"]
oidc_extra_audiences = []
oidc_enabled_signing_algs = ["RS256"]
allowed_groups = ["/secureops-operators"]
email_domains = ["lab.example"]
insecure_oidc_skip_nonce = false
insecure_oidc_skip_issuer_verification = false
insecure_oidc_allow_unverified_email = false
ssl_insecure_skip_verify = false
skip_oidc_discovery = false
skip_jwt_bearer_tokens = false
skip_auth_preflight = false
reverse_proxy = false
upstreams = ["http://api:3000/"]
upstream_timeout = "5s"
pass_access_token = false
pass_authorization_header = false
pass_basic_auth = false
pass_user_headers = false
set_authorization_header = false
set_xauthrequest = false
set_basic_auth = false
skip_auth_strip_headers = true
session_store_type = "cookie"
cookie_name = "secureops_session"
cookie_secret_file = "/run/secrets/cookie-secret"
cookie_secure = false
cookie_httponly = true
cookie_samesite = "lax"
cookie_csrf_samesite = "lax"
cookie_path = "/"
cookie_domains = []
cookie_expire = "5m"
cookie_refresh = "0s"
whitelist_domains = []
relative_redirect_url = false
request_logging = false
auth_logging = false
standard_logging = true
show_debug_on_error = false
silence_ping_logging = true
